name: firstpipeline

on:
  push:
    branches:
     - main
  workflow_dispatch:

jobs:
  build_pana_poren:
    runs-on: ubuntu-latest

    steps:
     - name:  checkout to runner
       uses: actions/checkout@v4

     - name:  Docker login
       uses: docker/login-action@v2
       with:
         username: ${{vars.DOCKER_USERNAME}}
         password: ${{secrets.DOCKER_PASSWORD}}

     - name: Remove old docker image
       run: docker rmi lokiii2001/xogame:latest || true     

     - name: build docker image     
       run: docker build -t lokiii2001/xogame:latest .

     - name: push docker image
       run: docker push lokiii2001/xogame:latest   

  deploy_pana_poren:
    runs-on: ubuntu-latest
    needs: build_pana_poren
    steps:
     - name: AWS EC2 SSH
       uses: appleboy/ssh-action@v0.1.5
       with:
         host: ${{vars.HOST_IP}}
         username: ${{vars.USERNAME}}
         password: ${{secrets.PASSWORD}}
         script: |
           docker pull lokiii2001/xogame:latest
           docker stop xogame || true
           docker rm xogame || true
           docker run -d --name xogame -p 80:80 lokiii2001/xogame:latest